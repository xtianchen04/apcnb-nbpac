<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sceau APCNB / NBPAC">
  <defs>
    <style>
      .navy { fill:#15263f; } .gold { fill:#b08a3e; }
      .sNavy { fill:none; stroke:#15263f; } .sGold { fill:none; stroke:#b08a3e; }
    </style>
  </defs>

  <!-- Seal rings -->
  <circle cx="100" cy="100" r="97" fill="#faf8f3"/>
  <circle cx="100" cy="100" r="97" class="sNavy" stroke-width="3"/>
  <circle cx="100" cy="100" r="90" class="sGold" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="86" class="sNavy" stroke-width="1"/>

  <!-- Decorative dots ring -->
  <g class="gold">
    <circle cx="100" cy="11.5" r="1.6"/><circle cx="100" cy="188.5" r="1.6"/>
    <circle cx="11.5" cy="100" r="1.6"/><circle cx="188.5" cy="100" r="1.6"/>
    <circle cx="37" cy="37" r="1.4"/><circle cx="163" cy="37" r="1.4"/>
    <circle cx="37" cy="163" r="1.4"/><circle cx="163" cy="163" r="1.4"/>
  </g>

  <!-- Laurel branches -->
  <g class="gold" opacity="0.95">
    <!-- left branch -->
    <path class="sGold" stroke-width="2" stroke-linecap="round" d="M58,158 C40,140 36,108 46,74"/>
    <g>
      <ellipse cx="48" cy="86" rx="7" ry="3.2" transform="rotate(-58 48 86)"/>
      <ellipse cx="46" cy="100" rx="7.5" ry="3.4" transform="rotate(-50 46 100)"/>
      <ellipse cx="47" cy="114" rx="7.5" ry="3.4" transform="rotate(-40 47 114)"/>
      <ellipse cx="51" cy="128" rx="7" ry="3.2" transform="rotate(-28 51 128)"/>
      <ellipse cx="57" cy="141" rx="6.2" ry="3" transform="rotate(-16 57 141)"/>
    </g>
    <!-- right branch (mirror) -->
    <path class="sGold" stroke-width="2" stroke-linecap="round" d="M142,158 C160,140 164,108 154,74"/>
    <g>
      <ellipse cx="152" cy="86" rx="7" ry="3.2" transform="rotate(58 152 86)"/>
      <ellipse cx="154" cy="100" rx="7.5" ry="3.4" transform="rotate(50 154 100)"/>
      <ellipse cx="153" cy="114" rx="7.5" ry="3.4" transform="rotate(40 153 114)"/>
      <ellipse cx="149" cy="128" rx="7" ry="3.2" transform="rotate(28 149 128)"/>
      <ellipse cx="143" cy="141" rx="6.2" ry="3" transform="rotate(16 143 141)"/>
    </g>
  </g>

  <!-- Scales of justice -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- finial -->
    <circle cx="100" cy="49" r="4.5" class="gold"/>
    <!-- central post -->
    <line x1="100" y1="53" x2="100" y2="120" class="sNavy" stroke-width="3.4"/>
    <!-- base -->
    <path class="navy" d="M88,128 q12,-9 24,0 z"/>
    <ellipse cx="100" cy="129" rx="17" ry="3.6" class="navy"/>
    <!-- beam -->
    <line x1="60" y1="64" x2="140" y2="64" class="sNavy" stroke-width="3.4"/>
    <circle cx="60" cy="64" r="2.6" class="gold"/>
    <circle cx="140" cy="64" r="2.6" class="gold"/>
    <!-- left pan -->
    <line x1="60" y1="64" x2="47" y2="92" class="sGold" stroke-width="1.4"/>
    <line x1="60" y1="64" x2="73" y2="92" class="sGold" stroke-width="1.4"/>
    <path class="navy" d="M44,91 Q60,110 76,91 Z"/>
    <!-- right pan -->
    <line x1="140" y1="64" x2="127" y2="92" class="sGold" stroke-width="1.4"/>
    <line x1="140" y1="64" x2="153" y2="92" class="sGold" stroke-width="1.4"/>
    <path class="navy" d="M124,91 Q140,110 156,91 Z"/>
  </g>

  <!-- Banner ribbon -->
  <g>
    <path class="navy" d="M44,150 L156,150 L150,162 L156,174 L44,174 L50,162 Z"/>
    <path class="gold" d="M44,150 L156,150 L156,153 L44,153 Z" opacity="0.5"/>
    <text x="100" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="12"
          letter-spacing="2" fill="#d9be83" font-weight="700">EST. 2026</text>
  </g>
</svg>
